<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="description"
      content="Pokémon Champions 寶可夢收藏紀錄工具，可在瀏覽器中標記已擁有的寶可夢。"
    />
    <meta name="theme-color" content="#df303b" />
    <title>Pokémon Champions 圖鑑</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>

    <header class="site-header">
      <a class="brand" href="./" aria-label="回到首頁">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Champions Tracker</span>
      </a>
    </header>

    <main id="app" class="page-shell" aria-live="polite">

        <span class="loading-spinner" aria-hidden="true"></span>
